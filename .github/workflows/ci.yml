name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run already in flight, so CI is
# never spending minutes on a commit that has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: lint, the contrast audit, unit and integration tests, build.
  # Runs separately from the browser suite so a lint error surfaces in under a
  # minute instead of waiting on Playwright.
  check:
    name: Lint, contrast, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit colour contrast
        run: npm run check:contrast

      - name: Run unit and integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The browser suite: keyboard order, responsive layout and the axe scan.
  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls the system libraries Chromium needs on a bare runner.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.js builds and serves the production bundle itself, so
      # the suite runs against what would actually be deployed.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
